<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧧 Bốc Thăm Lì Xì Tết 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c0152a;
    --red-dark: #8b0c1e;
    --red-light: #e8213b;
    --gold: #f5c842;
    --gold-light: #ffe878;
    --gold-dark: #c9942a;
    --cream: #fff8e7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #e8213b 0%, #c0152a 35%, #8b0c1e 70%, #5a0510 100%);
    font-family: 'Be Vietnam Pro', sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  /* Decorative background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(245,200,66,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(245,200,66,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle pattern overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23f5c842' fill-opacity='0.04'%3E%3Cpath d='M30 0l30 30-30 30L0 30z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* Zodiac animals canvas layer */
  #zodiacCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.18;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.8s ease both;
  }

  .header .lanterns {
    font-size: 2rem;
    letter-spacing: 8px;
    margin-bottom: 4px;
    animation: swingLantern 3s ease-in-out infinite alternate;
    display: block;
  }

  @keyframes swingLantern {
    from { letter-spacing: 8px; }
    to { letter-spacing: 12px; }
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 900;
    color: var(--gold-light);
    text-shadow: 0 0 30px rgba(245,200,66,0.6), 0 2px 4px rgba(0,0,0,0.4);
    letter-spacing: 2px;
    line-height: 1.2;
  }

  .header p {
    color: rgba(255,232,120,0.8);
    font-size: 0.95rem;
    margin-top: 6px;
    font-weight: 400;
  }

  .header h2 {
    color: rgba(255,232,120,0.8);

    margin-top: 6px;

  }

  .gold-line {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 12px auto 0;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Grid */
  .envelope-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 3vw, 24px);
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
  }

  /* Envelope */
  .envelope-wrap {
    perspective: 600px;
    cursor: pointer;
    animation: fadeIn 0.6s ease both;
  }

  .envelope-wrap:nth-child(1) { animation-delay: 0.1s; }
  .envelope-wrap:nth-child(2) { animation-delay: 0.15s; }
  .envelope-wrap:nth-child(3) { animation-delay: 0.2s; }
  .envelope-wrap:nth-child(4) { animation-delay: 0.25s; }
  .envelope-wrap:nth-child(5) { animation-delay: 0.3s; }
  .envelope-wrap:nth-child(6) { animation-delay: 0.35s; }
  .envelope-wrap:nth-child(7) { animation-delay: 0.4s; }
  .envelope-wrap:nth-child(8) { animation-delay: 0.45s; }
  .envelope-wrap:nth-child(9) { animation-delay: 0.5s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px) scale(0.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Idle float animation for each envelope - staggered so they feel alive */
  .envelope-wrap:not(.opened):not(:hover) .envelope {
    animation: idleFloat var(--float-dur, 3s) ease-in-out infinite var(--float-delay, 0s);
  }

  .envelope-wrap:nth-child(1) .envelope { --float-dur: 3.2s; --float-delay: 0s; }
  .envelope-wrap:nth-child(2) .envelope { --float-dur: 2.8s; --float-delay: -0.8s; }
  .envelope-wrap:nth-child(3) .envelope { --float-dur: 3.5s; --float-delay: -1.6s; }
  .envelope-wrap:nth-child(4) .envelope { --float-dur: 2.9s; --float-delay: -0.4s; }
  .envelope-wrap:nth-child(5) .envelope { --float-dur: 3.1s; --float-delay: -2.0s; }
  .envelope-wrap:nth-child(6) .envelope { --float-dur: 3.4s; --float-delay: -1.2s; }
  .envelope-wrap:nth-child(7) .envelope { --float-dur: 2.7s; --float-delay: -0.6s; }
  .envelope-wrap:nth-child(8) .envelope { --float-dur: 3.3s; --float-delay: -1.8s; }
  .envelope-wrap:nth-child(9) .envelope { --float-dur: 3.0s; --float-delay: -2.4s; }

  @keyframes idleFloat {
    0%   { transform: translateY(0px) rotate(0deg); }
    25%  { transform: translateY(-6px) rotate(0.8deg); }
    50%  { transform: translateY(-10px) rotate(0deg); }
    75%  { transform: translateY(-5px) rotate(-0.8deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }

  /* Shimmer pulse on idle envelopes */
  .envelope-wrap:not(.opened) .envelope-body {
    animation: idleGlow 4s ease-in-out infinite;
  }

  .envelope-wrap:nth-child(odd):not(.opened) .envelope-body  { animation-delay: -1s; }
  .envelope-wrap:nth-child(3n):not(.opened) .envelope-body   { animation-delay: -2s; }

  @keyframes idleGlow {
    0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,200,80,0.3), 0 0 0 1px rgba(245,200,66,0.15); }
    50%       { box-shadow: 0 12px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,200,80,0.5), 0 0 16px rgba(245,200,66,0.25), 0 0 0 1px rgba(245,200,66,0.3); }
  }

  .envelope-wrap:not(.opened):hover .envelope {
    animation: wobble 0.6s ease infinite alternate;
  }

  @keyframes wobble {
    from { transform: rotateY(-8deg) rotateZ(-2deg) scale(1.05); }
    to { transform: rotateY(8deg) rotateZ(2deg) scale(1.08); }
  }

  .envelope-wrap.opened {
    cursor: default;
  }

  .envelope-wrap.dimmed {
    opacity: 0.45;
    filter: saturate(0.4);
    transition: opacity 0.5s, filter 0.5s;
  }

  .envelope {
    position: relative;
    width: 100%;
    padding-bottom: 130%;
    border-radius: 12px;
    transition: transform 0.3s ease;
    transform-style: preserve-3d;
  }

  .envelope-body {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(160deg, #d42030 0%, #c0152a 40%, #9a0f22 100%);
    border: 2.5px solid var(--gold);
    box-shadow:
      0 8px 24px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,200,80,0.3),
      0 0 0 1px rgba(245,200,66,0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Gold pattern on envelope */
  .envelope-body::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1.5px solid rgba(245,200,66,0.35);
    border-radius: 8px;
    pointer-events: none;
  }

  .envelope-body::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 45%;
    background: linear-gradient(180deg, rgba(255,200,60,0.12) 0%, transparent 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    pointer-events: none;
  }

  /* Flap */
  .envelope-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, #e8213b 0%, #c0152a 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 12px 12px 0 0;
    transform-origin: top center;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    border-bottom: none;
  }

  .envelope-flap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(245,200,66,0.2) 0%, transparent 60%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }

  /* Envelope center symbol */
  .env-symbol {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .env-char {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(245,200,66,0.8), 0 2px 4px rgba(0,0,0,0.3);
    line-height: 1;
  }

  .env-dots {
    display: flex; gap: 4px;
  }

  .env-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.7;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .env-dots span:nth-child(2) { animation-delay: 0.3s; }
  .env-dots span:nth-child(3) { animation-delay: 0.6s; }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Shimmer on envelope */
  .env-shimmer {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.06) 50%, transparent 60%);
    border-radius: 12px;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    from { background-position: -200% center; }
    to { background-position: 200% center; }
  }

  /* Opened state */
  .envelope-wrap.opened .envelope-flap {
    transform: rotateX(-180deg);
  }

  .envelope-wrap.opened .envelope-body {
    background: linear-gradient(160deg, #b5102a 0%, #8b0c1e 100%);
    box-shadow: 0 0 40px rgba(245,200,66,0.4), 0 8px 32px rgba(0,0,0,0.5);
  }

  .opened-content {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.5s 0.4s ease, transform 0.5s 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    z-index: 20;
  }

  .envelope-wrap.opened .opened-content {
    opacity: 1;
    transform: scale(1);
  }

  .opened-emoji {
    font-size: clamp(1.4rem, 4vw, 2rem);
    margin-bottom: 4px;
    filter: drop-shadow(0 0 8px rgba(245,200,66,0.8));
  }

  .opened-label {
    font-size: clamp(0.5rem, 1.8vw, 0.75rem);
    font-weight: 700;
    color: var(--gold-light);
    text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    line-height: 1.3;
    padding: 0 4px;
  }

  /* ======================== POPUP ======================== */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60, 3, 12, 0.82);
    backdrop-filter: blur(10px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    padding: 20px;
  }

  .popup-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .popup {
    background: linear-gradient(160deg, #e0202e 0%, #b01020 50%, #8b0c1e 100%);
    border: 4px solid var(--gold);
    border-radius: 24px;
    padding: 44px 36px 36px;
    text-align: center;
    max-width: 440px;
    width: 100%;
    position: relative;
    transform: scale(0.5) translateY(60px);
    transition: transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
    box-shadow:
      0 0 0 6px rgba(245,200,66,0.15),
      0 0 80px rgba(245,200,66,0.35),
      0 30px 80px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  .popup-overlay.active .popup {
    transform: scale(1) translateY(0);
  }

  /* Double border frame */
  .popup::before {
    content: '';
    position: absolute;
    inset: 10px;
    border: 2px solid rgba(245,200,66,0.45);
    border-radius: 16px;
    pointer-events: none;
    z-index: 0;
  }

  /* Gold corner accents */
  .popup::after {
    content: '✦';
    position: absolute;
    top: 16px; right: 20px;
    font-size: 1.2rem;
    color: rgba(245,200,66,0.5);
    z-index: 1;
  }

  .popup-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(245,200,66,0.2) 0%, transparent 70%);
    border-radius: 50%;
    animation: glowPulse 2s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes glowPulse {
    from { transform: translate(-50%,-50%) scale(0.9); opacity: 0.5; }
    to   { transform: translate(-50%,-50%) scale(1.3); opacity: 1; }
  }

  .popup-congrats {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: rgba(255,232,120,0.85);
    letter-spacing: 3px;
    font-style: italic;
    position: relative;
    z-index: 2;
    margin-bottom: 6px;
  }

  .popup-emoji {
    font-size: clamp(5rem, 16vw, 7rem);
    line-height: 1;
    margin: 14px 0 10px;
    position: relative;
    z-index: 2;
    display: block;
    filter: drop-shadow(0 0 24px rgba(245,200,66,0.9)) drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  }

  .popup-reward {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 7vw, 2.8rem);
    font-weight: 900;
    color: var(--gold-light);
    text-shadow:
      0 0 30px rgba(245,200,66,0.9),
      0 0 60px rgba(245,200,66,0.5),
      0 3px 6px rgba(0,0,0,0.5);
    margin-bottom: 10px;
    position: relative;
    z-index: 2;
    line-height: 1.15;
    letter-spacing: 1px;
  }

  .popup-divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 12px;
    position: relative;
    z-index: 2;
  }

  .popup-sub {
    font-size: 1rem;
    font-weight: 600;
    color: rgba(255,232,120,0.85);
    position: relative;
    z-index: 2;
    letter-spacing: 0.5px;
  }

  .popup-close {
    margin-top: 28px;
    padding: 15px 48px;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
    color: #6b0010;
    border: none;
    border-radius: 50px;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    cursor: pointer;
    position: relative;
    z-index: 2;
    box-shadow:
      0 4px 0 rgba(0,0,0,0.25),
      0 6px 20px rgba(245,200,66,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }

  .popup-close:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 0 rgba(0,0,0,0.25), 0 12px 30px rgba(245,200,66,0.7);
  }

  .popup-close:active {
    transform: translateY(1px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 4px 16px rgba(245,200,66,0.4);
  }

  /* Animate children when popup opens */
  .popup-overlay.active .popup-congrats { animation: popIn 0.4s 0.15s ease both; }
  .popup-overlay.active .popup-emoji    { animation: popIn 0.5s 0.25s cubic-bezier(0.175,0.885,0.32,1.5) both; }
  .popup-overlay.active .popup-reward   { animation: popIn 0.4s 0.35s ease both; }
  .popup-overlay.active .popup-divider  { animation: popIn 0.3s 0.42s ease both; }
  .popup-overlay.active .popup-sub      { animation: popIn 0.3s 0.48s ease both; }
  .popup-overlay.active .popup-close    { animation: popIn 0.3s 0.55s ease both; }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(16px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ======================== FIREWORKS ======================== */
  .fireworks-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: burst linear forwards;
  }

  @keyframes burst {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: var(--tx) var(--ty) scale(0); }
  }

  /* ======================== RESET BUTTON ======================== */
  .reset-btn {
    margin-top: 28px;
    padding: 14px 40px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: var(--red-dark);
    border: none;
    border-radius: 50px;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 6px 24px rgba(245,200,66,0.4);
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .reset-btn.visible {
    opacity: 1;
    pointer-events: all;
    animation: fadeUp 0.5s ease;
  }

  .reset-btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 10px 32px rgba(245,200,66,0.6);
  }

  /* ======================== SPARKLE ======================== */
  .sparkle {
    position: absolute;
    pointer-events: none;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: sparkle-float 1.5s ease-out forwards;
  }

  @keyframes sparkle-float {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
  }

  /* ======================== RESPONSIVE ======================== */
  @media (max-width: 400px) {
    .envelope-grid { gap: 10px; max-width: 340px; }
    .popup { padding: 28px 20px; }
  }

  /* Number badge */
  .env-number {
    position: absolute;
    top: 6px; right: 8px;
    font-size: 0.65rem;
    font-weight: 700;
    color: rgba(245,200,66,0.6);
    font-family: 'Playfair Display', serif;
    z-index: 15;
  }

  /* Shake animation for winner */
  @keyframes winShake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-5deg); }
    40% { transform: rotate(5deg); }
    60% { transform: rotate(-5deg); }
    80% { transform: rotate(5deg); }
  }

  .win-shake .envelope {
    animation: winShake 0.4s ease !important;
  }
</style>
</head>
<body>

<canvas id="zodiacCanvas"></canvas>
<div class="fireworks-container" id="fireworks"></div>

<div class="wrapper">
  <div class="header">
    <span class="lanterns">🏮 🧧 🏮</span>
    <h1>BỐC THĂM LÌ XÌ</h1>
    <h2>Chúc Mừng Năm Mới Bính Ngọ 2026 </h2>
    <p>--- Website này tạo ra chỉ dành cho chị mà thuiii --- </p>
    <div class="gold-line"></div>
  </div>

  <div class="envelope-grid" id="grid"></div>

  <button class="reset-btn" id="resetBtn" onclick="resetGame()">
    🔄 Chơi Lại
  </button>
</div>

<!-- Popup -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup">
    <div class="popup-glow"></div>
    <div class="popup-congrats">🎉 Chúc Mừng! 🎉</div>
    <span class="popup-emoji" id="popupEmoji">🎁</span>
    <div class="popup-reward" id="popupReward">Phần thưởng</div>
    <div class="popup-divider"></div>
    <div class="popup-sub" id="popupSub">Năm mới vạn sự như ý!</div>
    <button class="popup-close" onclick="closePopup()">Đóng</button>
  </div>
</div>

<script>
// Fixed prize order - no shuffle
const prizes = [
  { emoji: '💖', label: '520.000đ', sub: 'Chắc chị iuu bicc ý nghĩa rui heee', short: '520K' },
  { emoji: '🤝', label: 'Nắm Tay', sub: 'Ừmm thìii...', short: '🤝' },
  { emoji: '😘', label: 'Thơm má', sub: ':))', short: '😘' },
  { emoji: '💰', label: '100.000đ', sub: 'Tiền lì xì đầu năm!', short: '100K' },
  { emoji: '💰', label: '200.000đ', sub: 'Tài lộc đầu xuân!', short: '200K' },
  { emoji: '💰', label: '300.000đ', sub: 'Phú quý năm mới!', short: '300K' },
  { emoji: '💰', label: '400.000đ', sub: 'Sung túc cả năm!', short: '400K' },
  { emoji: '🌷', label: 'Bó Hoa Tulip', sub: 'Đẹp như nàng xuân!', short: '🌷' },
  { emoji: '🍜', label: 'Một Bữa Đi Ăn', sub: 'Ngon & ấm cúng!', short: '🍜' },
];

let openedCount = 0;
let clickOrder = 0; // tracks which prize to give next
const total = 9;

// ======================== ZODIAC CANVAS ANIMATION ========================
const ZODIAC = ['🐭','🐮','🐯','🐰','🐲','🐍','🐴','🐑','🐵','🐔','🐶','🐷'];

class ZodiacSymbol {
  constructor(canvas) {
    this.canvas = canvas;
    this.reset(true);
  }
  reset(init = false) {
    this.x = Math.random() * this.canvas.width;
    this.y = init ? Math.random() * this.canvas.height : this.canvas.height + 60;
    this.size = 24 + Math.random() * 32;
    this.speed = 0.3 + Math.random() * 0.6;
    this.drift = (Math.random() - 0.5) * 0.4;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.008;
    this.opacity = 0.4 + Math.random() * 0.6;
    this.char = ZODIAC[Math.floor(Math.random() * ZODIAC.length)];
  }
  update() {
    this.y -= this.speed;
    this.x += this.drift;
    this.rotation += this.rotSpeed;
    if (this.y < -80) this.reset();
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = this.opacity;
    ctx.font = `${this.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.char, 0, 0);
    ctx.restore();
  }
}

function initZodiacCanvas() {
  const canvas = document.getElementById('zodiacCanvas');
  const ctx = canvas.getContext('2d');
  let symbols = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Create ~20 floating zodiac symbols
  for (let i = 0; i < 20; i++) symbols.push(new ZodiacSymbol(canvas));

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    symbols.forEach(s => { s.update(); s.draw(ctx); });
    requestAnimationFrame(animate);
  }
  animate();
}

initZodiacCanvas();

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  openedCount = 0;
  clickOrder = 0;

  prizes.forEach((prize, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'envelope-wrap';
    wrap.dataset.index = i;
    wrap.innerHTML = `
      <div class="envelope">
        <div class="envelope-body">
          <div class="env-shimmer"></div>
          <div class="envelope-flap"></div>
          <div class="env-symbol">
            <div class="env-char">福</div>
            <div class="env-dots">
              <span></span><span></span><span></span>
            </div>
          </div>
          <div class="opened-content">
            <div class="opened-emoji">${prize.emoji}</div>
            <div class="opened-label">${prize.label}</div>
          </div>
        </div>
        <div class="env-number">${i + 1}</div>
      </div>
    `;
    // Each envelope, when clicked, gives prize in sequential order
    wrap.addEventListener('click', () => openEnvelope(wrap, i));
    grid.appendChild(wrap);
  });
}

function openEnvelope(wrap, envelopeIndex) {
  if (wrap.classList.contains('opened')) return;

  // Get prize sequentially: 1st click = prizes[0], 2nd click = prizes[1], etc.
  const prize = prizes[clickOrder];
  clickOrder++;

  // Update the opened content to show the correct sequential prize
  wrap.querySelector('.opened-emoji').textContent = prize.emoji;
  wrap.querySelector('.opened-label').textContent = prize.label;

  wrap.classList.add('opened');
  openedCount++;

  // Shake effect
  wrap.classList.add('win-shake');
  setTimeout(() => wrap.classList.remove('win-shake'), 400);

  // Play sound
  playOpenSound();

  // Sparkles
  createSparkles(wrap);

  // Dim others
  document.querySelectorAll('.envelope-wrap:not(.opened)').forEach(el => {
    el.classList.add('dimmed');
  });

  // Show popup after flap animation
  setTimeout(() => {
    showPopup(prize);
    launchFireworks();
  }, 700);

  if (openedCount === total) {
    setTimeout(() => {
      document.getElementById('resetBtn').classList.add('visible');
    }, 1200);
  }
}

function showPopup(prize) {
  const overlay = document.getElementById('popupOverlay');
  document.getElementById('popupEmoji').textContent = prize.emoji;
  document.getElementById('popupReward').textContent = prize.label;
  document.getElementById('popupSub').textContent = prize.sub;

  // Reset animations by removing + re-adding active
  overlay.classList.remove('active');
  void overlay.offsetWidth; // force reflow
  overlay.classList.add('active');
}

function closePopup() {
  document.getElementById('popupOverlay').classList.remove('active');
  // Un-dim others so user can continue picking
  document.querySelectorAll('.envelope-wrap:not(.opened)').forEach(el => {
    el.classList.remove('dimmed');
  });
}

function resetGame() {
  document.getElementById('resetBtn').classList.remove('visible');
  clickOrder = 0;
  buildGrid();
}

// Sparkles
function createSparkles(wrap) {
  const rect = wrap.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  for (let i = 0; i < 16; i++) {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    const angle = (i / 16) * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    sp.style.left = cx + 'px';
    sp.style.top = cy + 'px';
    sp.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    sp.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    sp.style.background = Math.random() > 0.5 ? '#f5c842' : '#fff';
    sp.style.width = sp.style.height = (4 + Math.random() * 6) + 'px';
    sp.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 1500);
  }
}

// Fireworks
function launchFireworks() {
  const container = document.getElementById('fireworks');
  const colors = ['#f5c842', '#ffe878', '#ff6b6b', '#fff', '#ff9f43', '#ffd32a'];

  for (let burst = 0; burst < 5; burst++) {
    setTimeout(() => {
      const x = 15 + Math.random() * 70;
      const y = 10 + Math.random() * 50;
      for (let p = 0; p < 24; p++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const angle = (p / 24) * Math.PI * 2;
        const dist = 60 + Math.random() * 100;
        const tx = `translateX(${Math.cos(angle) * dist}px)`;
        const ty = `translateY(${Math.sin(angle) * dist}px)`;
        particle.style.cssText = `
          left: ${x}vw; top: ${y}vh;
          width: ${3 + Math.random() * 5}px;
          height: ${3 + Math.random() * 5}px;
          background: ${colors[Math.floor(Math.random() * colors.length)]};
          --tx: ${tx}; --ty: ${ty};
          animation-duration: ${0.8 + Math.random() * 0.6}s;
          box-shadow: 0 0 6px currentColor;
        `;
        container.appendChild(particle);
        setTimeout(() => particle.remove(), 1500);
      }
    }, burst * 200);
  }
}

// Sound
function playOpenSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Quick bright chime
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.08;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.start(t);
      osc.stop(t + 0.4);
    });

    // Shimmer noise
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.05;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    src.connect(g);
    g.connect(ctx.destination);
    src.start(ctx.currentTime + 0.1);
  } catch(e) {}
}

// Init
buildGrid();
</script>
